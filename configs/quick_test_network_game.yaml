description: Network-based prisoner's dilemma with different personality distributions
experiment_type: network_game
name: MBTI Network Game Experiment
game:
  game_name: prisoners_dilemma
  num_repetitions: 1
  num_rounds: 20
  random_seed: 42

llm:
  api_key: null
  provider: mock
  model_name: mock-model
  concurrency: 4
  kwargs:
    cooperation_rate: 0.5
    response_delay: 0

prompt_config:
  personality_injection: strong
  include_history: true
  include_opponent_type: true
  include_neighbor_stats: true

network_game_config:
  network_types:
  - regular_k4
  - small_world_k4_p0.1
  - small_world_k4_p0.5
  - scale_free_m2
  personality_scenarios:
  - uniform

network:
  num_nodes: 50
  seed: 42

output_dir: results
save_detailed_results: true
save_network_snapshots: true
save_visualizations: true

visualization_config:
  color_palette: Set2
  dpi: 300
  figsize:
  - 12
  - 8
  style: seaborn-v0_8
